<style>
  :root{
    --bg-peach:#f0fdf6;
    --bg-lavender:#e9fcf1;
    --bg-pink:#f2fdf8;
    --bg-base:#ffffff;
    --ink:#0a0a0a;
    --ink-soft:#5c6b62;
    --ink-faint:#9aabab;
    --card-bg:#ffffffee;
    --card-border:#d7f0e0;
    --divider:#e0f5e8;
    --input-bg:#ffffff;
    --input-border:#d7f0e0;
    --input-border-focus:#00e676;
    --pill-a:#00e676;
    --pill-b:#a3ff5f;
    --chip-track-bg:#eafcf1;
    --chip-active-bg:#ffffff;
    --month-btn-bg:#eafcf1;
    --month-btn-bg-hover:#d7f5e2;
    --green:#00c853;
    --green-bg:#e3f9ec;
    --red:#e53935;
    --red-bg:#fdeceb;
    --missed-border:#f3c6c3;
    --cell-bg:#ffffff;
    --cell-border:#d9ede1;
    --future-bg:#f6fdf9;
    --future-border:#eaf7ef;
    --flame:#ffb300;
    --shadow: 0 2px 12px rgba(11,61,46,0.07);
    --accent-line:#a3ff5f;
    --dashed-border:#bdeecb;
    --stat-border:#e6f7ec;
    --rm-color:#b8ccc0;
    --axis-line:#cdeada;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:8px;
    --serif: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  body.dark{
    --bg-peach:#0d1f17;
    --bg-lavender:#0a0a0a;
    --bg-pink:#0f1c15;
    --bg-base:#0a0a0a;
    --ink:#ffffff;
    --ink-soft:#8fae9d;
    --ink-faint:#4f6459;
    --card-bg:rgba(0,230,118,0.045);
    --card-border:rgba(0,230,118,0.16);
    --divider:rgba(0,230,118,0.12);
    --input-bg:rgba(0,230,118,0.05);
    --input-border:rgba(0,230,118,0.20);
    --input-border-focus:#00e676;
    --pill-a:#00e676;
    --pill-b:#a3ff5f;
    --chip-track-bg:rgba(0,230,118,0.07);
    --chip-active-bg:rgba(0,230,118,0.16);
    --month-btn-bg:rgba(0,230,118,0.08);
    --month-btn-bg-hover:rgba(0,230,118,0.16);
    --green:#00e676;
    --green-bg:rgba(0,230,118,0.16);
    --red:#ff5252;
    --red-bg:rgba(255,82,82,0.16);
    --missed-border:rgba(255,82,82,0.35);
    --cell-bg:rgba(0,230,118,0.03);
    --cell-border:rgba(0,230,118,0.14);
    --future-bg:rgba(255,255,255,0.02);
    --future-border:rgba(0,230,118,0.06);
    --flame:#ffc107;
    --shadow:0 2px 16px rgba(0,0,0,0.55);
    --accent-line:#00e676;
    --dashed-border:rgba(0,230,118,0.22);
    --stat-border:rgba(0,230,118,0.10);
    --rm-color:rgba(255,255,255,0.25);
    --axis-line:rgba(0,230,118,0.28);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(1200px 500px at 10% -10%, var(--bg-peach), transparent 60%),
      radial-gradient(1200px 500px at 50% -20%, var(--bg-lavender), transparent 60%),
      radial-gradient(1200px 500px at 90% -10%, var(--bg-pink), transparent 60%),
      var(--bg-base);
    min-height:100vh;
    padding:20px 20px 60px;
    transition:background-color .25s ease, color .25s ease;
  }
  .app{max-width:1180px;margin:0 auto;}

  .top-bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;}
  .theme-toggle, .notify-toggle{
    border:1px solid var(--card-border);background:var(--card-bg);color:var(--ink);
    padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;
  }
  .theme-toggle:hover, .notify-toggle:hover{background:var(--month-btn-bg-hover);}
  .notify-toggle.on{border-color:var(--green);color:var(--green);}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:32px 28px;max-width:340px;width:100%;box-shadow:var(--shadow);text-align:center;}
  .login-logo{width:64px;height:64px;border-radius:16px;margin-bottom:14px;}
  .login-card h1{font-family:var(--serif);font-weight:800;font-size:26px;margin:0 0 4px;color:var(--ink);}
  .login-tagline{font-size:12.5px;font-weight:600;letter-spacing:0.03em;background:linear-gradient(90deg, var(--pill-a), var(--pill-b));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 14px !important;text-transform:uppercase;}
  .login-card p{color:var(--ink-soft);font-size:13px;margin:0 0 20px;}
  .login-card input{width:100%;box-sizing:border-box;border:1px solid var(--input-border);background:var(--input-bg);color:var(--ink);border-radius:10px;padding:11px 14px;font-size:14px;margin-bottom:10px;outline:none;}
  .login-card input:focus{border-color:var(--input-border-focus);}
  .login-card button{width:100%;border:none;background:linear-gradient(90deg, var(--pill-a), var(--pill-b));color:#04170d;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;}
  .login-card button:hover{opacity:0.9;}
  .login-error{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;}
  .logout-btn{border:1px solid var(--card-border);background:var(--card-bg);color:var(--ink);padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;}
  .logout-btn:hover{background:var(--month-btn-bg-hover);}

  /* ---------- GROWTH ---------- */
  .section-nav{margin-bottom:16px;}
  .growth-page{max-width:720px;margin:0 auto;}
  .gr-title{font-family:var(--serif);font-size:30px;margin:6px 0 4px;text-align:center;color:var(--ink);}
  .gr-sub{color:var(--ink-soft);font-size:14px;text-align:center;margin:0 0 22px;}
  .gr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .gr-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-md);padding:22px 12px;text-align:center;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s ease, border-color .15s ease;}
  .gr-card:hover{transform:translateY(-2px);border-color:var(--input-border-focus);}
  .gr-card span{display:block;margin-top:8px;}
  .gr-card .emj{font-size:28px;}
  .gr-back{border:1px solid var(--card-border);background:var(--card-bg);color:var(--ink);padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;margin-bottom:16px;}
  .gr-back:hover{background:var(--month-btn-bg-hover);}
  .gr-other-row{display:flex;gap:8px;margin-top:6px;}
  .gr-other-row input{flex:1;border:1px dashed var(--dashed-border);background:var(--input-bg);color:var(--ink);border-radius:999px;padding:10px 16px;font-size:13.5px;outline:none;}
  .gr-other-row button{border:none;background:var(--ink);color:var(--bg-base);padding:10px 18px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;}
  .gr-q{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-md);padding:12px 16px;margin-bottom:10px;}
  .gr-q label{display:block;font-size:13.5px;color:var(--ink);margin-bottom:6px;}
  .gr-q input{width:100%;box-sizing:border-box;border:1px solid var(--input-border);background:var(--input-bg);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:13.5px;outline:none;}
  .gr-q input:focus{border-color:var(--input-border-focus);}
  .gr-primary-btn{width:100%;border:none;background:linear-gradient(90deg, var(--pill-a), var(--pill-b));color:#04170d;padding:13px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;}
  .gr-primary-btn:hover{opacity:0.9;}
  .gr-primary-btn:disabled{opacity:0.5;cursor:default;}
  .gr-task-list{margin-bottom:14px;}
  .gr-task-item{display:flex;align-items:center;gap:10px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:999px;padding:10px 16px;margin-bottom:8px;font-size:13.5px;color:var(--ink);}
  .gr-task-item span{flex:1;}
  .gr-task-item button{border:none;background:none;color:var(--rm-color);cursor:pointer;font-size:15px;}
  .gr-task-item button:hover{color:var(--red);}
  .gr-add-task-row{display:flex;gap:8px;margin-bottom:18px;}
  .gr-add-task-row input{flex:1;border:1px dashed var(--dashed-border);background:var(--input-bg);color:var(--ink);border-radius:999px;padding:10px 16px;font-size:13.5px;outline:none;}
  .gr-add-task-row button{border:none;background:var(--card-bg);border:1px solid var(--card-border);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:13px;cursor:pointer;}
  .gr-loading{text-align:center;padding:50px 10px;color:var(--ink-soft);font-size:14px;}
  .gr-loading .spin{font-size:30px;display:inline-block;animation:grSpin 1s linear infinite;margin-bottom:10px;}
  @keyframes grSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .gr-error{color:var(--red);font-size:13px;text-align:center;margin:10px 0;}
  .gr-timeline{margin-bottom:18px;}
  .gr-block{display:flex;gap:14px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:10px;align-items:flex-start;}

  const statusKey = (habitId, date) => habitId + '::' + dateKey(date);
  function effectiveStatus(habitId, date){
    const stored = data.statuses[statusKey(habitId,date)];
    if(stored === 'done') return 'done';
    const today = startOfDay(new Date());
    const d = startOfDay(date);
    if(d.getTime() > today.getTime()) return 'future';
    if(d.getTime() < today.getTime()) return 'missed';
    return 'pending';
  }
  function toggleStatus(habitId, date){
    const eff = effectiveStatus(habitId, date);
    if(eff === 'future') return;
    const key = statusKey(habitId, date);
    if(eff === 'done') delete data.statuses[key];
    else data.statuses[key] = 'done';
    scheduleSave();
  }
  function dayCompletionPct(date){
    if(data.habits.length === 0) return null;
    const today = startOfDay(new Date());
    if(startOfDay(date).getTime() > today.getTime()) return null;
    let done = 0;
    data.habits.forEach(h => { if(effectiveStatus(h.id, date) === 'done') done++; });
    return (done / data.habits.length) * 100;
  }
  function computeStreaks(){
    const created = startOfDay(new Date(data.createdAt));
    const today = startOfDay(new Date());
    let best = 0, running = 0;
    let cursor = new Date(created);
    while(cursor.getTime() <= today.getTime()){
      const pct = dayCompletionPct(cursor);
      if(pct !== null){
        if(pct >= 70){ running++; if(running > best) best = running; }
        else running = 0;
      }
      cursor = addDays(cursor, 1);
    }
    let current = 0;
    let d = new Date(today);
    while(d.getTime() >= created.getTime()){
      const pct = dayCompletionPct(d);
      if(pct === null){ d = addDays(d,-1); continue; }
      if(pct >= 70){ current++; d = addDays(d,-1); }
      else break;
    }
    return { current, best: Math.max(best, current) };
  }

  // ---------- 6pm reminder: sound ----------
  let audioCtx = null;
  let beepIntervalId = null;
  function ensureAudioCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ /* unsupported */ }
    } else if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
  }
  function beepOnce(){
    if(!audioCtx) return;
    try{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.value = 0.18;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.28);
    }catch(e){ /* ignore */ }
  }
  function startBeeping(){
    ensureAudioCtx();
    beepOnce();
    clearInterval(beepIntervalId);
    beepIntervalId = setInterval(beepOnce, 700);
  }
  function stopBeeping(){
    clearInterval(beepIntervalId);
    beepIntervalId = null;
  }

  // ---------- 6pm reminder: scheduling ----------
  let reminderModalOpen = false;
  let reminderRingTimer = null;

  function getRemainingHabitsToday(){
    const today = new Date();
    return data.habits.filter(h => effectiveStatus(h.id, today) === 'pending');
  }

  function checkReminder(){
    if(!data || !data.notifyEnabled) return;
    const today = dateKey(new Date());
    if(!data.reminder || data.reminder.date !== today){
      data.reminder = { date: today, attempt: 0, firstAttemptAt: null, done: false };
      scheduleSave();
    }
    const r = data.reminder;
    if(r.done || reminderModalOpen) return;
    const now = new Date();
    if(r.attempt === 0){
      if(now.getHours() === 18 && now.getMinutes() === 0){
        triggerReminderAttempt(1);
      }
    } else if(r.attempt === 1 && r.firstAttemptAt){
      if(Date.now() - r.firstAttemptAt >= 5*60*1000){
        triggerReminderAttempt(2);
      }
    }
  }

  function triggerReminderAttempt(attemptNum){
    const remaining = getRemainingHabitsToday();
    if(remaining.length === 0){
      data.reminder.done = true;
      scheduleSave();
      return;
    }
    data.reminder.attempt = attemptNum;
    if(attemptNum === 1) data.reminder.firstAttemptAt = Date.now();
    scheduleSave();

    reminderModalOpen = true;
    renderReminderModal(remaining);
    startBeeping();
    if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
      try{ new Notification('KeepIt', { body: `${remaining.length} habit${remaining.length===1?'':'s'} left today` }); }catch(e){}
    }
    clearTimeout(reminderRingTimer);
    reminderRingTimer = setTimeout(() => {
      stopBeeping();
      closeReminderModal();
      reminderModalOpen = false;
      if(attemptNum >= 2){
        data.reminder.done = true;
        scheduleSave();
      }
      // if attemptNum === 1, checkReminder() will fire attempt 2 five minutes after firstAttemptAt
    }, 60*1000);
  }

  function resolveReminder(action){
    clearTimeout(reminderRingTimer);
    stopBeeping();
    closeReminderModal();

  // ---------- reports ----------
  function buildReportStats(dates){
    const today = startOfDay(new Date());
    const elapsed = dates.filter(d => startOfDay(d).getTime() <= today.getTime());
    let totalDone = 0, totalPossible = 0, qualifyingDays = 0;
    const perHabit = data.habits.map(h => ({ id:h.id, name:h.name, emoji:h.emoji, done:0 }));
    elapsed.forEach(d => {
      const pct = dayCompletionPct(d);
      if(pct !== null && pct >= 70) qualifyingDays++;
      data.habits.forEach((h, i) => {
        if(effectiveStatus(h.id, d) === 'done'){ perHabit[i].done++; totalDone++; }
        totalPossible++;
      });
    });
    const overallPct = totalPossible ? Math.round((totalDone/totalPossible)*100) : 0;
    perHabit.sort((a,b) => b.done - a.done);
    return { elapsedDates: elapsed, elapsedDays: elapsed.length, overallPct, qualifyingDays, perHabit, totalDone, totalPossible };
  }

  function buildLineChartSVG(elapsedDates, mode){
    if(elapsedDates.length === 0){
      return `<div class="empty-note">Not enough data yet for this period.</div>`;
    }
    const points = elapsedDates.map(d => ({ date: d, pct: dayCompletionPct(d) || 0 }));
    const W = 640, H = 240, padL = 42, padR = 18, padT = 18, padB = 36;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const n = points.length;
    const xFor = i => n === 1 ? padL + plotW/2 : padL + (i * (plotW/(n-1)));
    const yFor = v => padT + plotH - (Math.max(0,Math.min(100,v))/100)*plotH;
    const baseY = padT + plotH;

    // axis lines (no gridlines, just left + bottom rules, like the reference chart)
    let axes = `
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${baseY}" style="stroke:var(--axis-line);stroke-width:1.2" />
      <line x1="${padL}" y1="${baseY.toFixed(1)}" x2="${W-padR}" y2="${baseY.toFixed(1)}" style="stroke:var(--axis-line);stroke-width:1.2" />`;
    [0,25,50,75,100].forEach(v => {
      const y = yFor(v);
      axes += `<text x="${padL-10}" y="${(y+3.5).toFixed(1)}" text-anchor="end" style="font-size:11px;fill:var(--ink-soft);font-family:var(--sans)">${v}</text>`;
    });
    // subtle 70% streak-goal reference line
    const y70 = yFor(70);
    axes += `<line x1="${padL}" y1="${y70.toFixed(1)}" x2="${W-padR}" y2="${y70.toFixed(1)}" style="stroke:var(--flame);stroke-width:1;stroke-dasharray:3,4;opacity:0.5" />`;

    let path = '';
    points.forEach((p,i) => {
      const x = xFor(i), y = yFor(p.pct);
      path += (i===0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    });

    let dots = '', labels = '';
    const labelEvery = mode === 'month' ? Math.max(1, Math.ceil(n/8)) : 1;
    points.forEach((p,i) => {
      const x = xFor(i), y = yFor(p.pct);
      const dotColor = p.pct >= 70 ? 'var(--green)' : 'var(--red)';
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" style="fill:${dotColor};stroke:var(--card-bg);stroke-width:2.5" />`;
      if(i % labelEvery === 0 || i === n-1){
        const lbl = mode === 'week' ? WD_SHORT[p.date.getDay()] : String(p.date.getDate());
        labels += `<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" style="font-size:12px;fill:var(--ink-soft);font-family:var(--sans)">${lbl}</text>`;
      }
    });

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
      ${axes}
      <path d="${path.trim()}" style="fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round" />
      ${dots}
      ${labels}
    </svg>`;
  }

    const mondayKey = dateKey(getMonday(today));
    const monthKey = `${today.getFullYear()}-${pad(today.getMonth()+1)}`;
    const queue = [];
    if(today.getDay() === 0 && data.lastWeeklyReportWeek !== mondayKey){
      data.lastWeeklyReportWeek = mondayKey;
      queue.push('weekly');
    }
    if(today.getDate() === 1 && data.lastMonthlyReportMonth !== monthKey){
      data.lastMonthlyReportMonth = monthKey;
      queue.push('monthly');
    }
    if(queue.length){
      scheduleSave();
      pendingReportQueue = queue.slice(1);
      page = queue[0] === 'weekly' ? 'reportWeekly' : 'reportMonthly';
      renderPage();

    if(t.matches('[data-gtier]')){
      growthPayTier = t.getAttribute('data-gtier');
      growthError = '';
      renderPage();
      return;
    }
    if(t.id === 'growthSubmitPaymentBtn'){ submitUpiPayment(); return; }
    if(t.matches('[data-gr-approve]')){ approveGrowthSubmission(t.getAttribute('data-gr-approve'), t.getAttribute('data-gr-tier')); return; }
    if(t.matches('[data-gr-reject]')){ rejectGrowthSubmission(t.getAttribute('data-gr-reject')); return; }
    if(t.id === 'growthAdminBackBtn'){
      const access = growthAccessInfo();
      growthStep = access.active ? (data.growth.habits.length > 0 ? 'dashboard' : 'category') : 'paywall';
      renderPage();
      return;
    }
    const gcatBtn = t.closest('[data-gcat]');
    if(gcatBtn){
      const cat = gcatBtn.getAttribute('data-gcat');
      if(cat === 'others'){
        growthStep = 'others-sub';
        renderPage();
      } else {
        growthCategory = cat;
        generateGrowthQuestions();
      }
      return;
    }
    if(t.id === 'growthOtherBtn'){
      const val = document.getElementById('growthOtherInput').value.trim();
      if(val){ growthCategory = val; generateGrowthQuestions(); }
      return;
    }
    if(t.id === 'growthBackBtn'){
      if(growthStep === 'others-sub') growthStep = 'category';
      else if(growthStep === 'questions') growthStep = 'category';
      else if(growthStep === 'tasks') growthStep = 'questions';
      growthError = '';
      renderPage();
      return;
    }
    if(t.id === 'growthQuestionsContinueBtn'){
      growthStep = 'tasks';
      renderPage();
      return;
    }
    if(t.id === 'growthAddTaskBtn'){
      const input = document.getElementById('growthTaskInput');
      const val = input.value.trim();
      if(val){ growthTasks.push(val); input.value=''; renderPage(); }
      return;
    }
    if(t.matches('[data-grm-task]')){
      const idx = Number(t.getAttribute('data-grm-task'));
      growthTasks.splice(idx,1);
      renderPage();
      return;
    }
    if(t.id === 'growthGeneratePlanBtn'){
      if(growthTasks.length > 0) generateGrowthPlan();
      return;
    }
    if(t.id === 'growthViewDashBtn'){
      growthStep = 'dashboard';
      renderPage();
      return;
    }
    if(t.id === 'growthStartOverBtn'){
      resetGrowthWizard();
      renderPage();
      return;
    }
    if(t.id === 'growthRedoPlanBtn'){
      resetGrowthWizard();
      renderPage();
      return;
    }
    if(t.id === 'growthViewPlanBtn'){
      growthPlan = data.growth.plan || [];
      growthCategory = data.growth.category;
      growthStep = 'plan';
      renderPage();
      return;
    }
    if(t.matches('[data-growth-view]')){
      growthViewMode = t.getAttribute('data-growth-view');
      renderPage();
      return;
    }
    if(t.matches('[data-growth-del-habit]')){
      const id = t.getAttribute('data-growth-del-habit');
      data.growth.habits = data.growth.habits.filter(h => h.id !== id);
      Object.keys(data.growth.statuses).forEach(k => { if(k.startsWith(id + '::')) delete data.growth.statuses[k]; });
      scheduleSave();
      renderPage();
      return;
    }
    if(t.matches('[data-growth-habit]') && t.matches('[data-growth-date]')){
      const id = t.getAttribute('data-growth-habit');
      const dk = t.getAttribute('data-growth-date');
      toggleGrowthStatus(id, new Date(dk + 'T00:00:00'));
      renderPage();
      return;
    }
    if(t.id === 'addGrowthHabitBtn'){
      const input = document.getElementById('newGrowthHabitInput');
      const val = input.value.trim();
      if(val){
        data.growth.habits.push({ id: 'g' + Date.now() + Math.random().toString(36).slice(2,7), name: val, emoji: suggestEmoji(val) });
        scheduleSave();
        input.value = '';
        renderPage();
      }
      return;
    }

    if(t.matches('[data-addline]')){
      const list = t.getAttribute('data-addline');
      data[list].push('');
      scheduleSave();
      renderSideCard(list==='rules'?'rulesBox':'motivationBox', list, list==='rules'?'my rules':'Daily motivation');
      return;
    }
    if(t.matches('[data-remove]')){
      const list = t.getAttribute('data-remove');
      const idx = Number(t.getAttribute('data-idx'));
      data[list].splice(idx,1);
      scheduleSave();
      renderSideCard(list==='rules'?'rulesBox':'motivationBox', list, list==='rules'?'my rules':'Daily motivation');
      return;
    }
    if(t.matches('[data-nav]')){
      const nav = t.getAttribute('data-nav');
      if(nav === 'prevMonth') monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth()-1, 1);
      if(nav === 'nextMonth') monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth()+1, 1);
      if(nav === 'prevWeek') weekCursor = addDays(weekCursor, -7);
      if(nav === 'nextWeek') weekCursor = addDays(weekCursor, 7);
      renderTitleBlock();
      renderGrid();
      return;
    }
    if(t.matches('[data-view]')){
      viewMode = t.getAttribute('data-view');
      renderTitleBlock();
      renderControlsBar();
      renderGrid();
      return;
    }
    if(t.matches('[data-report]')){
      const type = t.getAttribute('data-report');
      page = type === 'weekly' ? 'reportWeekly' : 'reportMonthly';
      renderPage();
      return;
    }
    if(t.matches('[data-del-habit]')){
      const id = t.getAttribute('data-del-habit');
      data.habits = data.habits.filter(h => h.id !== id);
      scheduleSave();
      renderGrid();
      renderControlsBar();
      return;
    }
    if(t.id === 'addHabitBtn'){
      const input = document.getElementById('newHabitInput');
      const name = input.value.trim();
      if(name){
        data.habits.push({ id:'h'+Date.now(), name, emoji: suggestEmoji(name) });
        scheduleSave();
        renderGrid();
        renderControlsBar();
      }
      return;
    }
    if(t.matches('.cell')){
      const habitId = t.getAttribute('data-habit');
      const date = new Date(t.getAttribute('data-date') + 'T00:00:00');
      toggleStatus(habitId, date);
      renderGrid();
      renderControlsBar();
      return;
    }
    if(t.id === 'backToTrackerBtn'){ goBackFromReport(); return; }
    if(t.matches('[data-report-nav]')){
      const dir = t.getAttribute('data-report-nav');
      if(page === 'reportWeekly') weekCursor = addDays(weekCursor, dir === 'prev' ? -7 : 7);
      else monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth() + (dir === 'prev' ? -1 : 1), 1);
      renderPage();
      return;
    }
    if(t.id === 'otherReportLink'){
      page = page === 'reportWeekly' ? 'reportMonthly' : 'reportWeekly';
      renderPage();
      return;
    }
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && e.target.id === 'newHabitInput'){
      document.getElementById('addHabitBtn').click();
    }
    if(e.key === 'Enter' && e.target.id === 'growthTaskInput'){
      document.getElementById('growthAddTaskBtn').click();
    }
    if(e.key === 'Enter' && e.target.id === 'growthOtherInput'){
      document.getElementById('growthOtherBtn').click();
    }
    if(e.key === 'Enter' && e.target.id === 'newGrowthHabitInput'){
      document.getElementById('addGrowthHabitBtn').click();
    }
  });

          <h1>KeepIt</h1>
          <p class="login-tagline">Build Habits. Keep Promises.</p>
          <p>${isSignup ? 'Create your own private account' : 'Log in to see your habits'}</p>
          <input type="email" id="loginEmail" placeholder="Email" autocomplete="username">
          <input type="password" id="loginPassword" placeholder="Password (min 6 characters)" autocomplete="${isSignup ? 'new-password' : 'current-password'}">
          <button id="loginBtn">${isSignup ? 'Sign up' : 'Log in'}</button>
          <div class="login-error">${errorMsg ? escapeAttr(errorMsg) : ''}</div>
          <button class="add-line" id="toggleAuthModeBtn" style="margin-top:14px;">${isSignup ? 'Already have an account? Log in' : "New here? Create your own account"}</button>
        </div>
      </div>
    `;
    el.dataset.mode = mode;

  async function handleLogin(){
    const mode = document.getElementById('loginRoot').dataset.mode || 'login';
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if(!sb){ renderLoginScreen('Supabase is not configured yet.', mode); return; }
    if(!email || !password){ renderLoginScreen('Enter your email and password.', mode); return; }
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = mode === 'signup' ? 'Creating account...' : 'Logging in...';

    if(mode === 'signup'){
      const { data: signupData, error } = await sb.auth.signUp({ email, password });
      if(error){ renderLoginScreen(error.message || 'Could not create account.', 'signup'); return; }
      if(signupData && signupData.session){
        // email confirmation not required -- straight in
        currentUserId = signupData.user.id;
        document.getElementById('loginRoot').innerHTML = '';
        document.getElementById('app').style.display = '';
        startApp();
      } else {
        renderLoginScreen('Account created! Check your email to confirm it, then log in below.', 'login');
      }
      return;
    }

    const { data: loginData, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      renderLoginScreen(error.message || 'Login failed. Check your email and password.', 'login');
      return;
    }
    currentUserId = loginData.user.id;
    document.getElementById('loginRoot').innerHTML = '';
    document.getElementById('app').style.display = '';
    startApp();
  }

  async function handleLogout(){
    if(sb) await sb.auth.signOut();
    currentUserId = null;
    clearInterval(reminderCheckInterval);
    document.getElementById('app').style.display = 'none';
    renderLoginScreen('', 'login');
  }

  document.addEventListener('click', (e) => {
    if(e.target.id === 'loginBtn') handleLogin();
    if(e.target.id === 'logoutBtn') handleLogout();
    if(e.target.id === 'toggleAuthModeBtn'){
      const current = document.getElementById('loginRoot').dataset.mode || 'login';
      renderLoginScreen('', current === 'login' ? 'signup' : 'login');
    }
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && (e.target.id === 'loginEmail' || e.target.id === 'loginPassword')){
      handleLogin();
    }
  });

  let reminderCheckInterval = null;
  async function startApp(){
    data = await loadData();
    applyTheme();
    renderTopBar();
    renderSectionNav();
    renderPage();
    checkAutoReports();
    clearInterval(reminderCheckInterval);
    reminderCheckInterval = setInterval(checkReminder, 15000);
  }

  (async function init(){
    if(!sb){
      // Supabase not configured yet -- fall back to using the app without login
      document.getElementById('app').style.display = '';
      startApp();
      return;
    }
    const { data: sessionData } = await sb.auth.getSession();
    if(sessionData && sessionData.session){
      currentUserId = sessionData.session.user.id;
      document.getElementById('app').style.display = '';
      startApp();
    } else {
      renderLoginScreen('', 'login');
    }
    sb.auth.onAuthStateChange((event) => {
      if(event === 'SIGNED_OUT'){
        currentUserId = null;
        document.getElementById('app').style.display = 'none';
        renderLoginScreen('', 'login');
      }
    });
  })();
})();
</script>
